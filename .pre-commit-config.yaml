minimum_pre_commit_version: "3.0.0"
default_stages: [pre-commit]
exclude: (?x)^(.*/(node_modules|\.next|out|dist|build|target|\.build|DerivedData|\.venv|venv|__pycache__|\.playwright-cli|test-results)/|.*\.(png|jpg|jpeg|gif|webp|ico|icns|svg|plist|xcstrings|pdf|sqlite|db|mp4|mov|zip|gz|bz2|xz|a|rlib|xcframework)$|^tenant-bootstrap/vendor/|^outputs/)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-added-large-files
      args: [--maxkb=2048]
    - id: detect-private-key
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.15
  hooks:
    - id: ruff-check
      stages: [manual]
- repo: local
  hooks:
    - id: check-trailing-whitespace-local
      name: trailing whitespace check-only
      entry: "python3 -c 'import pathlib,sys; bad=[];\nfor f in sys.argv[1:]:\n p=pathlib.Path(f);\n if not p.is_file(): continue\n try: data=p.read_bytes()\n except Exception: continue\n if b'\"'\"'\\0'\"'\"' in data: continue\n if any(line.rstrip(b'\"'\"'\\r\\n'\"'\"').endswith((b'\"'\"' '\"'\"',b'\"'\"'\\t'\"'\"')) for line in data.splitlines(True)): bad.append(f)\nprint('\"'\"'trailing whitespace in:\\n'\"'\"'+'\"'\"'\\n'\"'\"'.join(bad) if bad else '\"'\"''\"'\"', end='\"'\"''\"'\"'); sys.exit(1 if bad else 0)'"
      language: system
      types: [text]
      stages: [manual]
    - id: check-final-newline-local
      name: final newline check-only
      entry: "python3 -c 'import pathlib,sys; bad=[];\nfor f in sys.argv[1:]:\n p=pathlib.Path(f);\n if not p.is_file(): continue\n try: data=p.read_bytes()\n except Exception: continue\n if data and not data.endswith((b'\"'\"'\\n'\"'\"', b'\"'\"'\\r\\n'\"'\"')): bad.append(f)\nprint('\"'\"'missing final newline in:\\n'\"'\"'+'\"'\"'\\n'\"'\"'.join(bad) if bad else '\"'\"''\"'\"', end='\"'\"''\"'\"'); sys.exit(1 if bad else 0)'"
      language: system
      types: [text]
      stages: [manual]
    - id: gitleaks-local
      name: gitleaks staged secret scan
      entry: gitleaks git --pre-commit --redact --staged --verbose
      language: system
      pass_filenames: false
    - id: typos-local
      name: typos check-only
      entry: typos --force-exclude
      language: system
      types: [text]
      stages: [manual]
    - id: actionlint-local
      name: actionlint GitHub workflows
      entry: actionlint -shellcheck= -pyflakes=
      language: system
      files: ^\.github/workflows/.*\.ya?ml$
    - id: zizmor-local
      name: zizmor GitHub workflow security
      entry: zizmor --no-progress .github/workflows
      language: python
      additional_dependencies: [zizmor==1.25.2]
      pass_filenames: false
      files: ^\.github/workflows/
      stages: [manual]
    - id: shellcheck-local
      stages: [manual]
      name: shellcheck
      entry: shellcheck --severity=error
      language: system
      types: [shell]
    - id: shfmt-diff-local
      name: shfmt diff check-only
      entry: shfmt -d -i 2 -ci
      language: system
      files: \.(sh|bash)$
      stages: [manual]
