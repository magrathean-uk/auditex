[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditex"
version = "1.8.0"
description = "Read-only Microsoft 365 and Google Workspace tenant-audit toolkit for evidence collection"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MAGRATHEAN UK LTD", email = "contact+auditex@magrathean.uk" }]
dependencies = [
    "requests>=2.34.2,<3",
    "msal>=1.39.0,<2",
    # The certificate loader uses Certificate.not_valid_before_utc, added in cryptography 42.
    "cryptography>=42",
]

[project.urls]
Homepage = "https://magrathean.uk/solutions/auditex/"
Repository = "https://github.com/magrathean-uk/auditex"
Issues = "https://github.com/magrathean-uk/auditex/issues"

[project.optional-dependencies]
# Capped below 2: the server is tested against a fake FastMCP only, so a 2.x API change
# could silently drop the read-only tool annotations. Lift the cap only with a test that
# starts the real FastMCP server and checks every tool's annotations.
mcp = [
    "mcp>=1.30.0,<2",
]
# Test dependencies: pytest, and jsonschema to validate the SARIF and OSCAL exports against the
# official schemas vendored under tests/schemas. setuptools is the one builder `make dist`,
# `make release-archive` and the installed-wheel tests use (Python 3.12+ venvs ship without it);
# the pin keeps third-party rebuilds byte-identical, and `make dist` checks it.
test = [
    "pytest>=8",
    "jsonschema>=4.18,<5",
    "setuptools==84.2.1",
]
# The local answer (auditex explain, auditex run --explain), pinned to the measured runtime; the runner checks the
# version. PyPI ships llama-cpp-python as source only, so installing this extra builds llama.cpp: it needs CMake and
# a C and C++ compiler (the Xcode command line tools on macOS, where the build uses Metal; the MSVC build tools on
# Windows). Models are downloaded on first use, never installed by pip.
local-answer = [
    "llama-cpp-python==0.3.36",
]
google = [
    "google-auth>=2.58.1,<3",
    "google-auth-oauthlib>=1.4.1,<2",
    "google-api-python-client>=2.200.0,<3",
]

# Development tooling; never a runtime dependency. `make audit-deps` resolves and installs it
# into a build-directory tool environment, not into .venv. Ruff is the single pin `make lint`
# checks against; keep it equal to the ruff-pre-commit rev in .pre-commit-config.yaml.
dev = [
    "pip-audit>=2.9,<3",
    "ruff==0.17.0",
]

[project.scripts]
azure-tenant-audit = "azure_tenant_audit.cli:main"
auditex = "auditex.cli:main"
auditex-mcp = "auditex.mcp_server:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Named so import sorting does not depend on which packages are installed.
known-first-party = ["auditex", "azure_tenant_audit"]

[tool.ruff.lint.per-file-ignores]
# The Windows 365 entry points are rebound to windows365_workload on purpose (backward-compatible shims).
"tenant-bootstrap/scripts/seed-workload-az.py" = ["F811"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditex = ["answer_frames.json", "explorer_assets/*.css", "explorer_assets/*.html", "explorer_assets/*.js", "explorer_assets/fonts/*.woff2", "explorer_assets/fonts/*.range", "explorer_assets/fonts/OFL.txt", "explorer_assets/LICENSE-lucide.txt"]

[tool.setuptools.data-files]
# Includes SCuBA catalogues and current/legacy model_assessment schemas (including 2026-10-28).
"auditex/assets" = ["assets/*"]
"auditex/configs" = ["configs/*.json", "configs/explainer-*.json"]
"auditex/profiles" = ["profiles/*.md"]
"auditex/schemas" = ["schemas/*.json", "schemas/explainer.schema.json"]
"auditex/docs" = ["docs/*.md"]
"auditex/docs/guides" = ["docs/guides/*.md"]
"auditex/docs/reference" = ["docs/reference/*.md"]
"auditex/docs/legal" = ["docs/legal/*.md"]
"auditex/docs/provenance" = ["docs/provenance/*.md", "docs/provenance/*.csv"]
"auditex/agent" = ["agent/*.md", "agent/*.json"]
"auditex/skills/app-readonly-escalation" = ["skills/app-readonly-escalation/SKILL.md"]
"auditex/skills/auditex-operator" = ["skills/auditex-operator/SKILL.md"]
"auditex/skills/evidence-pack" = ["skills/evidence-pack/SKILL.md"]
"auditex/examples/sample_audit_bundle" = ["examples/sample_audit_bundle/*.json"]
"auditex/examples/demo_tenant" = ["examples/demo_tenant/*.json"]
"auditex/examples" = ["examples/google_workspace_sample.json"]
