[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditex"
version = "1.0.0"
description = "Portable AI-first Microsoft 365 and Google Workspace audit toolkit for evidence collection"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.34.2,<3",
    "msal>=1.39.0,<2",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.30.0,<3",
]
google = [
    "google-auth>=2.58.1,<3",
    "google-auth-oauthlib>=1.4.1,<2",
    "google-api-python-client>=2.200.0,<3",
]

[project.scripts]
azure-tenant-audit = "azure_tenant_audit.cli:main"
auditex = "auditex.cli:main"
auditex-mcp = "auditex.mcp_server:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditex = ["explorer_assets/*.css", "explorer_assets/*.html", "explorer_assets/*.js", "explorer_assets/fonts/*.woff2", "explorer_assets/fonts/*.range", "explorer_assets/fonts/OFL.txt", "explorer_assets/LICENSE-lucide.txt"]

[tool.setuptools.data-files]
"auditex/assets" = ["assets/*"]
"auditex/configs" = ["configs/*.json"]
"auditex/profiles" = ["profiles/*.md"]
"auditex/schemas" = ["schemas/*.json"]
"auditex/docs" = ["docs/*.md"]
"auditex/docs/guides" = ["docs/guides/*.md"]
"auditex/docs/reference" = ["docs/reference/*.md"]
"auditex/docs/legal" = ["docs/legal/*.md"]
"auditex/docs/provenance" = ["docs/provenance/*.md", "docs/provenance/*.csv"]
"auditex/agent" = ["agent/*.md", "agent/*.json"]
"auditex/skills/app-readonly-escalation" = ["skills/app-readonly-escalation/SKILL.md"]
"auditex/skills/auditex-operator" = ["skills/auditex-operator/SKILL.md"]
"auditex/skills/delegated-auth" = ["skills/delegated-auth/SKILL.md"]
"auditex/skills/evidence-pack" = ["skills/evidence-pack/SKILL.md"]
"auditex/examples/sample_audit_bundle" = ["examples/sample_audit_bundle/*.json"]
"auditex/examples/demo_tenant" = ["examples/demo_tenant/*.json"]
"auditex/examples" = ["examples/google_workspace_sample.json"]
