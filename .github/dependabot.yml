# Managed by Claude Code on 2026-10-03.
# Weekly, Friday 19:00 Europe/London. Minor and patch grouped; majors arrive as individual PRs.
# 7-day cooldown on new releases (version updates only; security updates are not delayed).
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    assignees:
      - "magrathean-uk"
    commit-message:
      prefix: "chore(deps)"
    # mcp stays below 2 until a real FastMCP annotation test exists (see pyproject.toml).
    # Ruff is pinned in the dev extra and as the pre-commit hook rev, and make lint needs both equal; a pip-only
    # bump would break lint, so the pre-commit Ruff PR carries the matching pyproject.toml edit instead.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    assignees:
      - "magrathean-uk"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
