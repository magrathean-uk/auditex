name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest

      - name: Smoke help
        run: |
          auditex --help
          auditex doctor --json
          auditex guided-run --help

      - name: Contract smoke
        run: |
          auditex run --offline --sample examples/sample_audit_bundle/sample_result.json --tenant-name ci --run-name contract --out outputs/ci-contract
          python - <<'PY'
          import json
          from pathlib import Path
          run = Path("outputs/ci-contract/ci-contract")
          validation = json.loads((run / "validation.json").read_text(encoding="utf-8"))
          manifest = json.loads((run / "run-manifest.json").read_text(encoding="utf-8"))
          assert validation["valid"], validation["issues"]
          assert manifest["contract_status"] == "valid"
          assert (run / "index" / "evidence.sqlite").exists()
          assert (run / "ai_context.json").exists()
          PY
