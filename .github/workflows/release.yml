name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Run release checks
        run: |
          python -m compileall -q src tests scripts
          python -m pytest
          python scripts/build-pages-site.py /tmp/auditex-pages

      - name: Build package
        run: python -m build

      - name: Verify package installs
        run: |
          python -m pip install dist/*.whl
          auditex --help
          auditex setup-guide google --collector-preset identity --format json

      - name: Resolve release tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          gh release create "$RELEASE_TAG" dist/* \
            --title "Auditex $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
