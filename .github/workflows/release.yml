name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[google,mcp]' build pytest

      - name: Run ship checks
        run: |
          make lint
          make test
          make contract-smoke
          ./scripts/oss-taint-scan.sh
          python3 scripts/build-pages-site.py /tmp/auditex-pages

      - name: Build distribution artifacts
        run: |
          python -m build
          test -f dist/*.whl
          test -f dist/*.tar.gz

      - name: Verify wheel install
        run: |
          bash scripts/release-smoke.sh dist /tmp/auditex-release-smoke

      - name: Resolve release metadata
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          PACKAGE_VERSION="$(python - <<'PY'
from azure_tenant_audit.versioning import package_version
print(package_version())
PY
)"
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "release tag $TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          gh release create "$RELEASE_TAG" dist/* \
            --title "Auditex v$PACKAGE_VERSION" \
            --generate-notes \
            --verify-tag
